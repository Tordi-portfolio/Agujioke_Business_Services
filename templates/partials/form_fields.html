{% if form.non_field_errors %}
  <div class="message error">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="form-group">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small class="help">{{ field.help_text|safe }}</small>{% endif %}
    {% for error in field.errors %}<small class="error-text">{{ error }}</small>{% endfor %}
  </div>
{% endfor %}
